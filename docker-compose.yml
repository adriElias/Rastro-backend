services:
  postgres:
    image: postgres:16-alpine
    container_name: rastro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rastro_internal

  adminer:
    image: adminer:4
    container_name: rastro-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - rastro_internal

volumes:
  postgres_data:
    name: rastro_postgres_data

networks:
  rastro_internal:
    name: rastro_internal_net
    driver: bridge
